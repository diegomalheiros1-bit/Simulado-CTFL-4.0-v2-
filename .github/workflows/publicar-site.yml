name: Publicar simulador no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do simulador
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
