<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de transição de estados da questão 23</title>
  <desc id="desc">Estados START, NOT FULL e FULL, com cinco transições válidas de Add e Remove controladas pelo valor N.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="900" height="390" rx="18" fill="#ffffff"/>

  <g fill="none" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 190 195 H 348"/>
    <path d="M 512 184 C 585 112, 640 112, 682 171"/>
    <path d="M 682 221 C 615 285, 555 285, 510 220"/>
    <path d="M 397 145 C 365 48, 472 48, 440 145"/>
    <path d="M 397 235 C 365 338, 472 338, 440 235"/>
  </g>

  <g fill="#ffffff" stroke="#0f172a" stroke-width="3">
    <ellipse cx="120" cy="195" rx="70" ry="46"/>
    <ellipse cx="430" cy="195" rx="82" ry="52"/>
    <ellipse cx="750" cy="195" rx="70" ry="46"/>
  </g>

  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">
    <text x="120" y="202">START</text>
    <text x="430" y="191">NOT</text>
    <text x="430" y="215">FULL</text>
    <text x="750" y="202">FULL</text>
  </g>

  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">
    <text x="270" y="181">Add / N := 1</text>
    <text x="598" y="112">Add [N = 2] / N := N + 1</text>
    <text x="602" y="306">Remove / N := N − 1</text>
    <text x="430" y="39">Add [N &lt; 2] / N := N + 1</text>
    <text x="430" y="375">Remove [N &gt; 0] / N := N − 1</text>
  </g>
</svg>
